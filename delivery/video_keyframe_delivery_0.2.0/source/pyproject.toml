[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-keyframe-retrieval"
version = "0.2.0"
description = "Video keyframe retrieval with SigLIP2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "opencv-python-headless>=4.8", "PyYAML>=6"]

[project.optional-dependencies]
model = ["torch>=2.2", "transformers>=4.57,<5", "sentencepiece>=0.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_keyframe*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
