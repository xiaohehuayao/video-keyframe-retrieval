model:
  name: checkpoints/siglip2-base-patch16-224
  device: cuda
  dtype: float16
  batch_size: 32
sampling:
  sample_fps: 2.0 #推荐，每秒钟采样多少帧
  sample_stride: null 
  max_video_duration: null
  decode_backend: opencv
scoring:
  candidate_quantile: 0.90        # P0.5 fallback only; 保留分数最高的约 10%
  negative_weight: 0.0
postprocess:
  p2_multi_anchor:
    enabled: true
    min_anchor_gap_seconds: 5.0 #峰值之间间隔必须超过5s
    max_anchor_count: 3 #最多3个峰值
    relative_ratio: 0.8 #相对阈值
    max_peak_radius_seconds: 2.0 #峰值向左向右各扩2s
    max_frames_per_peak: 1 #每个峰值最多保留1帧
  p3_video:
    enabled: true
    max_anchor_count: 2
    relative_ratio: 0.7
    max_peak_radius_seconds: 10.0
    merge_overlapping_segments: true
output:
  video:
    export_clips: true
    ffmpeg_path: ffmpeg
  jpeg_quality: 95
  include_score: true
  include_frame_index: true
